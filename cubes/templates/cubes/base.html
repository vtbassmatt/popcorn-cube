<!doctype html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popcorn Cube</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'cubes/popcorn-card-fan.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cubes/theme.css' %}">
  </head>
  <body>
    <div class="stars"></div>
    <div class="stars-2"></div>
    <div class="stars-3"></div>
    <canvas id="sky-effects" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'cube-list' %}">
          <img src="{% static 'cubes/popcorn-card-fan.svg' %}" alt="" width="30" height="24"
               class="d-inline-block align-text-top bg-primary bg-gradient rounded border">
          Popcorn Cube
        </a>
        <div class="d-flex text-white">
          <span class="navbar-text me-3"><a href="{{ REPO_URL }}" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-git" viewBox="0 0 16 16">
  <path d="M15.698 7.287 8.712.302a1.03 1.03 0 0 0-1.457 0l-1.45 1.45 1.84 1.84a1.223 1.223 0 0 1 1.55 1.56l1.773 1.774a1.224 1.224 0 0 1 1.267 2.025 1.226 1.226 0 0 1-2.002-1.334L8.58 5.963v4.353a1.226 1.226 0 1 1-1.008-.036V5.887a1.226 1.226 0 0 1-.666-1.608L5.093 2.465l-4.79 4.79a1.03 1.03 0 0 0 0 1.457l6.986 6.986a1.03 1.03 0 0 0 1.457 0l6.953-6.953a1.03 1.03 0 0 0 0-1.457"/>
</svg></a></span>
          <span class="navbar-text me-3">git:<code>{{ COMMIT_HASH }}</code> ref:<code>{{ DEPLOY_REF }}</code></span>
          {% if user.is_authenticated %}
          <form class="d-flex" method="post" action="{% url 'logout' %}">
            <span class="me-3 navbar-text">{{ user.username }}</span>
            <button class="btn btn-outline-light" type="submit">Logout</button>
            {% csrf_token %}
          </form>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>

    <script src="{% static 'cubes/sky-effects.js' %}"></script>
  </body>
</html>
