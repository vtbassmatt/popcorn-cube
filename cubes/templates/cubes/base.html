<!doctype html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popcorn Cube</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'cubes/favicon-card-fan.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'cube-list' %}">
          <img src="{% static 'cubes/favicon-card-fan.svg' %}" alt="" width="30" height="24"
               class="d-inline-block align-text-top bg-secondary rounded border">
          Popcorn Cube
        </a>
        <div class="d-flex text-white">
          {% if user.is_authenticated %}
            <span class="me-3">{{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
