<datalist id="card-name-suggestions"></datalist>
<span id="card-name-autocomplete-spinner" class="spinner-border spinner-border-sm text-primary ms-2 d-none" role="status" aria-live="polite">
  <span class="visually-hidden">Loading card suggestions...</span>
</span>
<script>
  (function () {
    const input = document.querySelector('input[data-card-autocomplete="1"]');
    const datalist = document.getElementById("card-name-suggestions");
    const spinner = document.getElementById("card-name-autocomplete-spinner");
    if (!input || !datalist || !spinner) return;

    input.insertAdjacentElement("afterend", spinner);

    const scryfallAutocompleteUrl = "https://api.scryfall.com/cards/autocomplete";
    const formatLegality = "{{ cube.format_legality }}";
    let timeoutId = null;
    let pendingController = null;

    const setLoading = function (isLoading) {
      spinner.classList.toggle("d-none", !isLoading);
    };

    const updateSuggestions = function (cardNames) {
      datalist.innerHTML = "";
      for (const cardName of cardNames) {
        const option = document.createElement("option");
        option.value = cardName;
        datalist.appendChild(option);
      }
    };

    input.addEventListener("input", function () {
      const query = input.value.trim();
      if (query.length < 2) {
        updateSuggestions([]);
        setLoading(false);
        if (pendingController) {
          pendingController.abort();
          pendingController = null;
        }
        return;
      }
      if (timeoutId) clearTimeout(timeoutId);
      timeoutId = setTimeout(async function () {
        if (pendingController) pendingController.abort();
        const controller = new AbortController();
        pendingController = controller;
        setLoading(true);
        try {
          const searchTerms = [query, "in:paper"];
          if (formatLegality) {
            searchTerms.push("legal:" + formatLegality);
          }
          const params = new URLSearchParams({ q: searchTerms.join(" "), include_extras: "false" });
          const response = await fetch(`${scryfallAutocompleteUrl}?${params}`, {
            headers: { Accept: "application/json" },
            signal: controller.signal,
          });
          if (!response.ok) {
            updateSuggestions([]);
            return;
          }
          const payload = await response.json();
          updateSuggestions(Array.isArray(payload.data) ? payload.data : []);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          updateSuggestions([]);
        } finally {
          if (pendingController === controller) {
            pendingController = null;
            setLoading(false);
          }
        }
      }, 150);
    });
  })();
</script>
