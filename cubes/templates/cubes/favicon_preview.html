{% extends "cubes/base.html" %}
{% load static %}

{% block content %}
<h1 class="h3 mb-3">Favicon concepts</h1>
<div class="row row-cols-1 row-cols-md-2 g-3">
  <div class="col">
    <div class="card h-100">
      <div class="card-body text-center">
        <img src="{% static 'cubes/favicon-popcorn-card.svg' %}" alt="Popcorn in a card frame" width="96" height="96">
        <h2 class="h6 mt-3">Popcorn-in-a-Card</h2>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card h-100">
      <div class="card-body text-center">
        <img src="{% static 'cubes/favicon-card-fan.svg' %}" alt="Fanned cards with popcorn kernel" width="96" height="96">
        <h2 class="h6 mt-3">Three-Card Fan + Kernel</h2>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card h-100">
      <div class="card-body text-center">
        <img src="{% static 'cubes/favicon-bucket-card.svg' %}" alt="Popcorn bucket with card corners" width="96" height="96">
        <h2 class="h6 mt-3">Popcorn Bucket + Card Cues</h2>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card h-100">
      <div class="card-body text-center">
        <img src="{% static 'cubes/favicon-monogram-pc.svg' %}" alt="PC monogram with card frame accents" width="96" height="96">
        <h2 class="h6 mt-3">Monogram PC + Card Frame</h2>
      </div>
    </div>
  </div>
</div>
{% endblock %}
